name = "greed-learning"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "greed-learning-db"
database_id = "REPLACE_WITH_ACTUAL_ID"
migrations_dir = "./src/db/migrations"

[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "greed-learning-assets"

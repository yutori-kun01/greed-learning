name = "greed-learning"

# Entry point produced by `opennextjs-cloudflare build` (npm run build:worker).
# Without `main` / `[assets]`, `wrangler deploy` aborts with
# "Missing entry-point to Worker script or to assets directory".
main = ".open-next/worker.js"

# nodejs_compat behaves as v2 only from 2024-09-23 onward; Next.js 16 and
# better-auth need the v2 surface, so keep this date recent.
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

# wrangler's esbuild defaults to keep_names, which wraps functions in a
# `__name()` helper. next-themes serializes its anti-flash function into an
# inline <script> via toString(), so that helper reached the browser, where
# it does not exist: "ReferenceError: __name is not defined" on every page and
# the saved theme was never applied before paint.
keep_names = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Smart Placement: run the Worker next to D1 instead of next to the visitor.
# A member page makes a dozen or so D1 queries, many of them one after
# another, so every one of them paying a cross-region round trip added up
# to seconds per page.
[placement]
mode = "smart"

# Workers Logs — lets `npx wrangler tail` and the dashboard show runtime
# errors, which is the only way to debug a deployed Worker.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "greed-learning-db"
database_id = "295a88a0-9e37-4368-99d3-dae38dac6100"
migrations_dir = "./src/db/migrations"

[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "greed-learning-assets"

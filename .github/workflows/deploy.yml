name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      # The repository's current default branch. Drop this line once the
      # default branch has been renamed to main.
      - claude/attachment-image-design-tkv2mx
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Fails fast, before the ~5 minute build, when the repo has not been
      # given its Cloudflare credentials yet — the most common first-deploy
      # mistake. See DEPLOY.md section 5.
      - name: Preflight — required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          missing=0
          if [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::error::Secret BETTER_AUTH_SECRET is not set. Without it nobody can sign in. See docs/SETUP_GUIDE.md step 5."
            missing=1
          fi
          if [ -z "$BOOTSTRAP_ADMIN_EMAIL" ]; then
            echo "::warning::Secret BOOTSTRAP_ADMIN_EMAIL is not set. On a fresh site nobody can become admin or open signup until it is. See docs/SETUP_GUIDE.md step 7."
          fi
          if { [ -n "$TURNSTILE_SITE_KEY" ] && [ -z "$TURNSTILE_SECRET_KEY" ]; } || { [ -z "$TURNSTILE_SITE_KEY" ] && [ -n "$TURNSTILE_SECRET_KEY" ]; }; then
            echo "::error::Set both Variable TURNSTILE_SITE_KEY and Secret TURNSTILE_SECRET_KEY, or neither. With only one, the bot check cannot work."
            missing=1
          fi
          # Every later step reads the public URL from APP_URL. A value saved
          # without a scheme ("greed-learning.x.workers.dev") would become a
          # relative URL in auth callbacks and share links, so add https://
          # and drop a trailing slash rather than fail the deploy over it.
          app_url="$NEXT_PUBLIC_APP_URL"
          if [ -n "$app_url" ]; then
            case "$app_url" in
              http://*|https://*) ;;
              *)
                echo "::warning::Variable NEXT_PUBLIC_APP_URL has no scheme; using https://$app_url. Update the variable to include https:// to silence this."
                app_url="https://$app_url"
                ;;
            esac
            app_url="${app_url%/}"
          fi
          echo "APP_URL=$app_url" >> "$GITHUB_ENV"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is not set. Settings → Secrets and variables → Actions → New repository secret."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set. Settings → Secrets and variables → Actions → New repository secret."
            missing=1
          fi
          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            echo "::warning::Variable NEXT_PUBLIC_APP_URL is not set. The deploy will still work, but absolute URLs (auth callbacks, OG tags, Stripe redirects) fall back to request-derived values. Set it to your production URL and re-run."
          fi
          [ "$missing" -eq 0 ] || exit 1

          # An expired, revoked or mistyped token otherwise surfaces later as
          # "D1 database not found", which sends people after the wrong fix.
          # User tokens and account-owned tokens verify at different paths.
          verify() {
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1" 2>/dev/null | grep -q '"status":"active"'
          }
          if ! verify "https://api.cloudflare.com/client/v4/user/tokens/verify" \
             && ! verify "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid, expired or revoked (Cloudflare rejected it). Create a new token (My Profile → API Tokens → 'Edit Cloudflare Workers' template, plus D1 Edit) and replace the repository secret."
            exit 1
          fi

      # No `version:` here on purpose — package.json's "packageManager" field
      # is the single source of truth. Specifying both makes action-setup abort
      # with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        # Blocking. Pre-existing no-explicit-any uses are warnings (see
        # eslint.config.mjs), so this fails only on real errors.
        run: pnpm run lint --max-warnings=-1

      - name: Test
        run: pnpm run test

      - name: Build (Next.js)
        run: pnpm run build
        env:
          # Placeholder values so build-time code paths that reference these
          # don't fail — the real values are Workers secrets injected at
          # runtime (see DEPLOY.md), not read from this build step.
          DB: dummy
          BETTER_AUTH_SECRET: dummy
          NEXT_PUBLIC_APP_URL: ${{ env.APP_URL }}

      - name: Build (Cloudflare Worker)
        run: pnpm run build:worker
        env:
          DB: dummy
          BETTER_AUTH_SECRET: dummy
          NEXT_PUBLIC_APP_URL: ${{ env.APP_URL }}

      # D1 must already exist and its id must match wrangler.toml, otherwise the
      # deploy silently succeeds against a database the app cannot use. R2 is
      # cheap to create on demand, so the first deploy bootstraps it.
      - name: Ensure Cloudflare resources exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Look the database up by name across the account. `wrangler d1 info`
          # resolves through wrangler.toml's database_id, so it cannot tell "no
          # database" from "database_id points somewhere else" — it fails the
          # same way for both, and would never see a mismatched id.
          if ! npx wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"; then
            echo "::error::Could not list D1 databases. Check that CLOUDFLARE_API_TOKEN has D1 Edit permission."
            exit 1
          fi
          node scripts/check-d1-binding.mjs "$RUNNER_TEMP/d1-list.json" wrangler.toml
          if ! npx wrangler r2 bucket info greed-learning-assets >/dev/null 2>&1; then
            echo "R2 bucket 'greed-learning-assets' not found — creating it."
            npx wrangler r2 bucket create greed-learning-assets
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply greed-learning-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # After Deploy: `wrangler secret` needs the Worker to already exist.
      # Anything not set in GitHub is skipped, never blanked.
      - name: Sync Worker runtime secrets
        run: node scripts/sync-worker-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          # Better Auth resolves BETTER_AUTH_URL first, so pointing it at the
          # same public URL keeps auth callbacks correct.
          BETTER_AUTH_URL: ${{ env.APP_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

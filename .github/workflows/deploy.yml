name: Deploy to Cloudflare

on:
  push:
    branches:
      - claude/attachment-image-design-tkv2mx
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        # Non-blocking: the codebase has ~80 pre-existing no-explicit-any
        # errors by convention (not regressions), so a hard gate here would
        # block every deploy. Still runs so issues are visible in the log.
        run: pnpm run lint
        continue-on-error: true

      - name: Test
        run: pnpm run test

      - name: Build (Next.js)
        run: pnpm run build
        env:
          # Placeholder values so build-time code paths that reference these
          # don't fail — the real values are Workers secrets injected at
          # runtime (see DEPLOY.md), not read from this build step.
          DB: dummy
          BETTER_AUTH_SECRET: dummy
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

      - name: Build (Cloudflare Worker)
        run: pnpm run build:worker
        env:
          DB: dummy
          BETTER_AUTH_SECRET: dummy
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply greed-learning-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
